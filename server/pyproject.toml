[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onrecord-server"
version = "0.1.0"
description = "Conversation memory server for OnRecord (Meta glasses, Bay-Valley Hacks 2026)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
ml = [
    "faster-whisper>=1.0",
    "chromadb>=0.5",
    "psycopg[binary]>=3.1",
    "sentence-transformers>=2.7",
    "insightface>=0.7",
    "speechbrain>=1.0",
]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["onrecord*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
